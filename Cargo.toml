[package]
name = "pdf-mcp-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pdf-mcp-server"
path = "main.rs"

[dependencies]
lopdf = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
